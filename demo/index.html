<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TheoryVerse catalogue demo</title><style>body{font:16px system-ui;background:#141b2b;color:#edf2ff;max-width:720px;margin:40px auto;padding:20px}input,select{font:inherit;padding:10px;margin:6px}article{background:#26334a;padding:16px;margin:10px 0;border-radius:10px}</style><h1>TheoryVerse — Concept catalogue</h1><p>Independent demonstration with fictional records, not original theories or scientific findings.</p><label>Search <input id="q" placeholder="Try learning"></label><label>Status <select id="status"><option value="">All</option><option>hypothesis</option><option>conceptual</option><option>illustrative</option></select></label><div id="results" aria-live="polite"></div><script>const data=[['Fictional concept A','hypothesis','learning'],['Fictional concept B','conceptual','systems'],['Fictional concept C','illustrative','learning and design']];const q=document.querySelector('#q'),s=document.querySelector('#status'),root=document.querySelector('#results');function render(){root.replaceChildren();let count=0;for(const [title,status,tags] of data){if(s.value&&s.value!==status)continue;if(!(title+' '+tags).toLowerCase().includes(q.value.trim().toLowerCase()))continue;const a=document.createElement('article');a.textContent=title+' — '+status+' | '+tags;root.append(a);count++}if(!count)root.textContent='No matching fictional records.'}q.oninput=render;s.onchange=render;render();</script><p>Conceptual status does not establish empirical validity.</p></html>
